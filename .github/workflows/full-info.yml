name: Get full info

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: metadata-full-info-${{ github.repository }}
  queue: max

jobs:
  generate:
    uses: sergey-symbiotic/metadata-validation-scripts/.github/workflows/full-info.yml@4717a7ffa3fd26bdfb2db3f65d09c11394e1b437
    with:
      implementation-ref: 4717a7ffa3fd26bdfb2db3f65d09c11394e1b437
