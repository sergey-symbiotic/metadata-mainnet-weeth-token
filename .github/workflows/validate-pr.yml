name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: metadata-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate metadata
        id: validate
        continue-on-error: true
        uses: sergey-symbiotic/metadata-validation-scripts@5db4ac5ff5e4171b01ace750c9ee46ebae351f42
        with:
          pull-request: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          chain-id: 1
          rpc-url: https://ethereum-rpc.publicnode.com
          network-registry: "0xc773b1011461e7314cf05f97d95aa8e92c1fd8aa"
          operator-registry: "0xad817a6bc954f678451a71363f04150fdd81af9f"
          vault-registry: "0xaeb6bdd95c502390db8f52c8909f703e9af6a346"
          # Configure the verified registries for both rewards types before rollout.
          rewards-factory: ${{ vars.DEFAULT_STAKING_REWARDS_V2_FACTORY }}
          rewards-epoched-factories: ${{ vars.DEFAULT_STAKING_REWARDS_V2_EPOCHED_FACTORIES }}
          adapter-registry: "0x0462B857dD6AC1FBc22f84f9f73Dd74AE7721E5B"

      - name: Upload structured validation result
        if: always() && steps.validate.outputs.result-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: metadata-validation-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.validate.outputs.result-file }}
          if-no-files-found: error
          retention-days: 1

      - name: Propagate validation failure
        if: always() && (steps.validate.outcome != 'success' || steps.validate.outputs.result-file == '')
        run: exit 1
